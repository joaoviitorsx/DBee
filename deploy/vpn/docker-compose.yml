# Sidecar de VPN — subir junto do DBee (ADR 014, docs/operacao.md).
#
# Rede `dbee-vpn` exclusiva: só o DBee alcança o controle (7600) e as portas
# encaminhadas. O sidecar NÃO entra na dokploy-network — lá qualquer outra app
# chegaria ao banco do cliente sem passar pelo DBee.
#
# No serviço do DBee: entrar também na rede `dbee-vpn` e definir
#   DBEE_VPN_CONTROLE=http://dbee-vpn:7600
#   DBEE_VPN_TOKEN=<o mesmo CONTROL_TOKEN>
#   DBEE_VPN_PERFIS=cliente-a,cliente-b
services:
  dbee-vpn:
    build:
      context: ../..
      dockerfile: deploy/vpn/Dockerfile
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      CONTROL_TOKEN: ${DBEE_VPN_TOKEN:?defina DBEE_VPN_TOKEN (>= 24 caracteres)}
    # .ovpn e senha da gerência só em memória, nunca na camada gravável.
    tmpfs:
      - /run/dbee-vpn:mode=0700
    networks: [dbee-vpn]
networks:
  dbee-vpn:
    name: dbee-vpn
    internal: false
