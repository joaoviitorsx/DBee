# DBee — Dokploy, Compose Path deploy/docker-compose.yml (DBee.md §8).
# Sem porta publicada de propósito: acesso só via Traefik do Dokploy com a
# regra da tailnet, ou bind no IP 100.x do Tailscale (DBee.md §7).
services:
  dbee:
    image: ghcr.io/joaoviitorsx/dbee:latest
    restart: unless-stopped
    environment:
      # Único obrigatório. Deriva a chave que cifra as senhas das conexões;
      # perdê-lo torna as conexões ilegíveis (README, DBee.md §7). Guarde nos
      # secrets do Dokploy, não em `.env` versionado.
      APP_SECRET: ${APP_SECRET}
      # DBEE_DATA_DIR fica no default /data, persistido pelo volume abaixo.
      # ADMIN_PASSWORD e DOKPLOY_DEPLOY_WEBHOOK NÃO existem no código — a senha
      # do admin nasce no log do primeiro boot. Ver README.
    volumes:
      # O SQLite E o salt de cifra vivem aqui. Perder este volume = perder as
      # conexões, mesmo com o APP_SECRET certo.
      - dbee-data:/data
    networks:
      - dokploy-network

volumes:
  dbee-data:
networks:
  dokploy-network:
    external: true
