services:
  dbee:
    image: ghcr.io/joaoviitorsx/dbee:latest
    # Sem isto o redeploy pode não trazer nada: `docker compose up -d` reusa a
    # `:latest` que já está em cache no host, mesmo que a tag tenha mudado no
    # registry. O deploy diria sucesso e o app continuaria na versão velha —
    # exatamente o que o botão "Atualizar" existe para não fazer (DBee.md §8).
    pull_policy: always
    restart: unless-stopped
    # Acesso pela tailnet (http://<ip-tailscale>:3001). Sem isto o app só é
    # alcançável por domínio configurado no Dokploy.
    ports:
      - "3001:3001"
    # Variável do Dokploy só chega ao container se estiver listada aqui: o
    # painel alimenta a SUBSTITUIÇÃO do compose, não o ambiente do serviço.
    # `:-` deixa vazio quando ausente — e vazio é "desligado" para o DBee.
    environment:
      APP_SECRET: ${APP_SECRET}
      DBEE_VPN_CONTROLE: ${DBEE_VPN_CONTROLE:-}
      DBEE_VPN_TOKEN: ${DBEE_VPN_TOKEN:-}
      DBEE_VPN_PERFIS: ${DBEE_VPN_PERFIS:-}
    volumes:
      - dbee-data:/data
    networks:
      - dokploy-network
      - dbee-vpn

  # VPN por pessoa (ADR 014). Opcional: só sobe com COMPOSE_PROFILES=vpn no
  # Dokploy. Fora da dokploy-network de propósito — lá qualquer outra app
  # alcançaria as portas encaminhadas para o banco do cliente.
  dbee-vpn:
    profiles: [vpn]
    # Imagem publicada pelo release (sem `build:`: o compose "raw" do Dokploy
    # não tem o repositório). Mesma tag do DBee.
    image: ghcr.io/joaoviitorsx/dbee-vpn:latest
    pull_policy: always
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      CONTROL_TOKEN: ${DBEE_VPN_TOKEN:-}
    tmpfs:
      - /run/dbee-vpn:mode=0700
    networks:
      - dbee-vpn

volumes:
  dbee-data:
networks:
  dokploy-network:
    external: true
  # Rede exclusiva DBee ⇄ sidecar. Criada por este compose; não ligue outro
  # serviço nela.
  dbee-vpn:
