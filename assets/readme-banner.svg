<svg width="960" height="260" viewBox="0 0 960 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DBee — Cliente PostgreSQL web, self-hosted">
  <!-- Paleta do design-system: surface #191612 / sunken #141210, ink #f7f3ec, âmbar #F5A623 (acento único). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#191612"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7B84B"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <rect width="960" height="260" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="959" height="259" rx="23.5" fill="none" stroke="#221E19"/>

  <!-- Favo de mel de leve no canto, a abelha assinando o cabeçalho (opacity baixa, âmbar). -->
  <g opacity="0.12" fill="none" stroke="#F5A623" stroke-width="2">
    <path d="M812 34 l26 15 v30 l-26 15 -26 -15 v-30 z"/>
    <path d="M864 64 l26 15 v30 l-26 15 -26 -15 v-30 z"/>
    <path d="M812 94 l26 15 v30 l-26 15 -26 -15 v-30 z"/>
    <path d="M916 34 l26 15 v30 l-26 15 -26 -15 v-30 z"/>
  </g>

  <!-- Glyph da marca: a abelha cujo corpo é um cilindro de banco de dados. -->
  <g transform="translate(76 78)">
    <!-- asas, âmbar a 55% -->
    <g fill="#F5A623" opacity="0.55">
      <ellipse cx="34" cy="20" rx="22" ry="13" transform="rotate(-24 34 20)"/>
      <ellipse cx="70" cy="20" rx="22" ry="13" transform="rotate(24 70 20)"/>
    </g>
    <!-- corpo = cilindro de DB -->
    <g>
      <rect x="30" y="26" width="44" height="56" rx="22" fill="url(#amber)"/>
      <!-- listras do banco / da abelha, em tinta escura -->
      <path d="M31 44 h42" stroke="#191612" stroke-width="5" stroke-linecap="round"/>
      <path d="M31 60 h42" stroke="#191612" stroke-width="5" stroke-linecap="round"/>
      <!-- topo do cilindro -->
      <ellipse cx="52" cy="28" rx="22" ry="8" fill="#F7B84B"/>
      <ellipse cx="52" cy="28" rx="22" ry="8" fill="none" stroke="#191612" stroke-width="2" opacity="0.35"/>
    </g>
    <!-- cabeça + antenas -->
    <circle cx="52" cy="94" r="13" fill="url(#amber)"/>
    <g stroke="#F5A623" stroke-width="3" stroke-linecap="round">
      <path d="M46 104 q-8 12 -16 14"/>
      <path d="M58 104 q8 12 16 14"/>
    </g>
    <circle cx="30" cy="120" r="3.5" fill="#F5A623"/>
    <circle cx="74" cy="120" r="3.5" fill="#F5A623"/>
  </g>

  <!-- Wordmark: "D" em tinta, "Bee" em âmbar — distinção só de cor, como no app. -->
  <text x="210" y="132" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-3">
    <tspan fill="#f7f3ec">D</tspan><tspan fill="#F5A623">Bee</tspan>
  </text>

  <!-- Tagline, em muted quente. -->
  <text x="214" y="176" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="0.3" fill="#a8998a">Cliente PostgreSQL web · self-hosted · um container</text>

  <!-- Régua âmbar da marca sob o texto. -->
  <rect x="214" y="196" width="360" height="3" rx="1.5" fill="#F5A623" opacity="0.7"/>
</svg>
