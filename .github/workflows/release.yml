name: release

# Publica no GHCR a cada tag vX.Y.Z (DBee.md §8).
on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest

      # Constrói e CARREGA no docker local, sem publicar ainda. O smoke roda
      # sobre esta imagem; só depois de passar é que ela vai ao registry — uma
      # imagem que não serve a UI nunca é publicada.
      - name: Build (carrega local, sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test do ARTEFATO (DBee.md §11.42): o binário compilado serve a UI?
      # GET / (HTML), o bundle JS (MIME de JS) e /api sem sessão (401). Foi o
      # buraco entre "os testes passam" e "a imagem funciona".
      - name: Smoke test da imagem
        run: |
          IMG=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)
          scripts/smoke-image.sh "$IMG"

      # Publica só depois do smoke. A imagem local já tem todas as tags do meta.
      - name: Push (depois do smoke passar)
        run: |
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while read -r t; do
            [ -n "$t" ] && docker push "$t"
          done
